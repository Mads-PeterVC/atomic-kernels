[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[project]
name = "atomic-kernels"
requires-python = ">=3.12"
license = "Apache-2.0"
version = "0.1.0"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "click>=8.1.0",
    "rich-click>=1.8.0",
]

[project.optional-dependencies]
neighborlist = ["ak-neighborlist"]
viewer = ["ak-viewer"]
widget = ["ak-widget"]
all = ["atomic-kernels[neighborlist,viewer,widget]"]

[project.scripts]
ak = "atomic_kernels.cli:main"

[tool.uv.sources]
ak-neighborlist = { path = "../ak-neighborlist", editable = true }
ak-viewer = { path = "../ak-viewer", editable = true }
ak-widget = { path = "../ak-widget", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
