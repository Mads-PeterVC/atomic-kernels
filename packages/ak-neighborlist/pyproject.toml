[project]
name = "ak-neighborlist"
description = "Neighbor-list utilities for atomic structures"
readme = "README.md"
authors = [
    { name = "Mads-Peter", email = "machri@phys.au.dk" }
]
license = "Apache-2.0"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
requires-python = ">=3.12"
dynamic = ["version"]

dependencies = [
    "ase>=3.23.0",
    "numpy>=1.24.4",
]

[dependency-groups]
test = [
    "pytest>=8.3.0",
]

[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "../../crates/ak-neighborlist-py/Cargo.toml"
python-source = "src/"
module-name = "ak_neighborlist._ak_neighborlist"

[tool.pytest.ini_options]
pythonpath = ["."]
