[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[project]
name = "atomic-kernels"
requires-python = ">=3.8"
license = "Apache-2.0"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "ase>=3.23.0",
    "numpy>=1.24.4",
    "scipy>=1.10.1",
]

[dependency-groups]
docs = [
    "zensical",
]
test = [
    "pytest>=8.3.0",
]

[tool.maturin]
manifest-path = "crates/ak-py/Cargo.toml"
python-source = "python"
module-name = "atomic_kernels._atomic_kernels"

[tool.pytest.ini_options]
markers = [
    "viewer_integration: launches the real Bevy viewer and waits for readiness",
]
