name: CI

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - development
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-build:
    name: Rust Build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-stable-workspace
          cache-workspace-crates: "true"

      - uses: ./.github/actions/install-linux-build-deps

      - name: Build Rust workspace
        run: cargo build --workspace --locked

  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-stable-workspace
          cache-workspace-crates: "true"
          save-if: "false"

      - uses: ./.github/actions/install-linux-build-deps

      - name: Run Rust tests
        run: cargo test --workspace --locked

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      ATOMIC_KERNELS_USE_REAL_EXTENSION: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-stable-workspace
          cache-workspace-crates: "true"
          save-if: "false"

      - uses: ./.github/actions/install-linux-build-deps

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: api
          cache: true

      - name: Build extension in-place
        run: pixi run build-python

      - name: Run Python tests
        run: pixi run test

  viewer-integration:
    name: Viewer Integration
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      ATOMIC_KERNELS_USE_REAL_EXTENSION: "1"
      ATOMIC_KERNELS_RUN_VIEWER_TESTS: "1"
      ATOMIC_KERNELS_RUN_RUST_HEADLESS_TESTS: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-stable-workspace
          cache-workspace-crates: "true"
          save-if: "false"

      - uses: ./.github/actions/install-linux-build-deps

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: api
          cache: true

      - name: Build extension in-place
        run: pixi run build-python

      - name: Run Rust headless integration tests
        run: cargo test -p ak-vis viewer::headless::tests --locked

      - name: Run Python viewer integration tests
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pixi run viewer-test-python

      - name: Run Python headless integration tests
        run: pixi run headless-test-python
