name: Rust Build POC

on:
  push:
    branches:
      - codex/cache-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-build-poc:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-stable-workspace
          cache-workspace-crates: "true"

      - uses: ./.github/actions/install-linux-build-deps

      - name: Build Rust workspace
        run: cargo build --workspace --locked

  rust-test-poc:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-stable-workspace
          cache-workspace-crates: "true"
          save-if: "false"

      - uses: ./.github/actions/install-linux-build-deps

      - name: Run Rust tests
        run: cargo test --workspace --locked

  python-maturin-test-poc:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
      ATOMIC_KERNELS_USE_REAL_EXTENSION: "1"
      ATOMIC_KERNELS_RUN_VIEWER_TESTS: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-stable-workspace
          cache-workspace-crates: "true"
          save-if: "false"

      - uses: ./.github/actions/install-linux-build-deps

      - name: Install Python test dependencies
        run: uv sync --group test --no-install-project

      - name: Install maturin
        run: uv tool install maturin

      - name: Build extension in-place
        run: uv run --no-sync maturin develop

      - name: Run Python tests
        run: .venv/bin/pytest tests
