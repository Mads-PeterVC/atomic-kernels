name: Python Wheel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build macOS arm64 wheel
    runs-on: macos-14
    permissions:
      contents: write
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-14-wheel
          cache-workspace-crates: "true"

      - name: Install build tooling
        run: python -m pip install --upgrade pip maturin

      - name: Build wheel
        run: maturin build --release --interpreter python3.12 --out dist

      - name: Verify wheel output
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi
          wheel_name="$(basename "${wheels[0]}")"
          echo "Built wheel: ${wheel_name}"
          case "${wheel_name}" in
            *cp312*macosx*_arm64.whl) ;;
            *)
              echo "Wheel tag does not match the expected cp312 macOS arm64 target"
              exit 1
              ;;
          esac

      - name: Smoke test wheel install
        run: |
          set -euo pipefail
          python -m venv wheel-test-venv
          source wheel-test-venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          python -c "import atomic_kernels; print(atomic_kernels.__file__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: atomic-kernels-wheel-macos-arm64-cp312
          path: dist/*.whl
          if-no-files-found: error

      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
