name: Python Wheel

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build ${{ matrix.platform.label }} wheel (Python ${{ matrix.python.version }})
    runs-on: ${{ matrix.platform.runs-on }}
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: macOS arm64
            runs-on: macos-14
            cache-key: macos-arm64
            artifact-suffix: macos-arm64
            wheel-pattern: macosx*_arm64.whl
            install-linux-build-deps: false
          - label: macOS x86_64
            runs-on: macos-15-intel
            cache-key: macos-x86_64
            artifact-suffix: macos-x86_64
            wheel-pattern: macosx*_x86_64.whl
            install-linux-build-deps: false
          - label: Linux x86_64
            runs-on: ubuntu-24.04
            cache-key: linux-x86_64
            artifact-suffix: linux-x86_64
            wheel-pattern: linux*x86_64.whl
            install-linux-build-deps: true
        python:
          - version: "3.12"
            tag: cp312
          - version: "3.13"
            tag: cp313
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python.version }}

      - uses: astral-sh/setup-uv@v7

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.platform.cache-key }}-wheel
          cache-workspace-crates: "true"

      - uses: ./.github/actions/install-linux-build-deps
        if: ${{ matrix.platform.install-linux-build-deps }}

      - name: Install build tooling
        run: uv tool install maturin

      - name: Build wheel
        run: maturin build --release --interpreter python${{ matrix.python.version }} --out dist

      - name: Verify wheel output
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "Expected exactly one wheel, found ${#wheels[@]}"
            exit 1
          fi
          wheel_name="$(basename "${wheels[0]}")"
          echo "Built wheel: ${wheel_name}"
          case "${wheel_name}" in
            *"${{ matrix.python.tag }}"*${{ matrix.platform.wheel-pattern }}) ;;
            *)
              echo "Wheel tag does not match the expected ${{ matrix.python.tag }} ${{ matrix.platform.artifact-suffix }} target"
              exit 1
              ;;
          esac

      - name: Smoke test wheel install
        run: |
          set -euo pipefail
          uv venv wheel-test-venv --python python${{ matrix.python.version }}
          uv pip install --python wheel-test-venv/bin/python dist/*.whl
          wheel-test-venv/bin/python -c "import atomic_kernels; print(atomic_kernels.__file__)"

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: atomic-kernels-wheel-${{ matrix.platform.artifact-suffix }}-${{ matrix.python.tag }}
          path: dist/*.whl
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-wheel
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: atomic-kernels-wheel-*
          merge-multiple: true

      - name: Verify release asset count
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 6 ]; then
            echo "Expected 6 wheel assets, found ${#wheels[@]}"
            exit 1
          fi

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
          generate_release_notes: true
