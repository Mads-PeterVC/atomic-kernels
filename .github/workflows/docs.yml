name: Docs

on:
  push:
    branches:
      - development
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "docs/**"
      - "pyproject.toml"
      - "scripts/stage_rustdoc.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-stable-workspace
          cache-workspace-crates: "true"

      - uses: astral-sh/setup-uv@v7

      - uses: ./.github/actions/install-linux-build-deps

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install docs dependencies
        run: uv sync --only-group docs --no-install-project

      - name: Build docs
        run: .venv/bin/zensical build --config-file docs/zensical.toml

      - name: Build Rust API docs
        run: cargo doc --no-deps -p ak-core -p ak-vis

      - name: Stage Rust API docs
        run: .venv/bin/python scripts/stage_rustdoc.py

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
