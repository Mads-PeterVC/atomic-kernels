name: Docs

on:
  push:
    branches:
      - development
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "crates/**"
      - "docs/**"
      - "packages/atomic-kernels/**"
      - "packages/atomic-kernels/scripts/stage_rustdoc.py"
      - "pixi.toml"
      - "pixi.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ubuntu-stable-workspace
          cache-workspace-crates: "true"

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: docs
          cache: true

      - uses: ./.github/actions/install-linux-build-deps

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build docs
        run: pixi run -e docs zensical build --config-file docs/zensical.toml

      - name: Build Rust API docs
        run: cargo doc --no-deps -p ak-core -p ak-vis

      - name: Stage Rust API docs
        run: pixi run -e docs python docs/scripts/stage_rustdoc.py

      - name: Copy WASM
        run: cp -rf wasm-pkg docs/site/pkg

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs/site

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/development' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
