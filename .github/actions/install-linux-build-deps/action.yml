name: Install Linux build dependencies
description: Install native Linux packages required for Rust workspace builds in CI.

runs:
  using: composite
  steps:
    - name: Install Linux build dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libasound2-dev \
          libegl1-mesa-dev \
          libudev-dev \
          libwayland-dev \
          libx11-dev \
          libxcursor-dev \
          libxi-dev \
          libxinerama-dev \
          libxkbcommon-dev \
          libxrandr-dev \
          mesa-vulkan-drivers \
          pkg-config \
          xvfb
