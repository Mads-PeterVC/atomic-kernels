[package]
name = "ak-wasm"
edition = "2024"
version.workspace = true

[dependencies]
ak-core = { path = "../ak-core" }
ak-vis = { path = "../ak-vis" }
bevy = { version = "0.18", default-features = true, features = ["experimental_bevy_ui_widgets", "webgpu"] }
wasm-bindgen = "0.2.126"
web-sys = { version = "0.3.103", features = ["Element", "HtmlCanvasElement"] }

[lib]
crate-type = ["cdylib", "rlib"]
