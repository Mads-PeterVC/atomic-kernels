[project]
site_name = "atomic-kernels"
repo_url = "https://github.com/Mads-PeterVC/atomic-kernels"
site_url = "https://mads-petervc.github.io/atomic-kernels/"
site_author = "Mads-Peter Verner Christiansen"
docs_dir = "src"
site_dir = "site"
use_directory_urls = false
nav = [
  {"Home" = [
    {"Overview" = "index.md"},
    {"Getting Started" = "getting-started.md"},
    {"Architecture" = "architecture.md"},
  ]},
  {"Viewer" = [
    {"Examples" = "viewer-examples.md"},
    {"Configuration" = "viewer-configuration.md"},
    {"Scripts" = "viewer-scripts.md"},
    {"WASM" = "viewer-wasm.md"},
  ]},
  {"Development" = [
    {"Instructions" = "agent-development.md"},
    {"Notes" = "agent-development-notes.md"},
    {"Features" = "agent-development-features.md"},
  ]},
  {"Python API" = [
    {"Overview" = "api/python.md"},
    {"Neighbor Lists" = "api/python-neighbor-list.md"},
    {"Viewer" = "api/python-viewer.md"},
    {"Sessions" = "api/python-sessions.md"},
    {"Controllers" = "api/python-controllers.md"},
  ]},
  {"Rust API" = [
    {"Overview" = "api/rust.md"},
    {"Documentation" = "api/documentation.md"},
  ]}
]

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["../python"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
docstring_section_style = "list"
filters = ["!^_"]
heading_level = 2
inherited_members = true
merge_init_into_class = true
parameter_headings = false
separate_signature = false
show_root_full_path = false
show_root_heading = true
show_root_toc_entry = false
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = false
signature_crossrefs = true
summary = false

[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
ignore_init_summary = false

[project.theme]
features = [
  "content.code.copy",
  "navigation.tabs",
  "navigation.sections",
]

# Palette toggle for automatic mode
[[project.theme.palette]]
primary = "deep purple"
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep purple"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep purple"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions.pymdownx.superfences]
